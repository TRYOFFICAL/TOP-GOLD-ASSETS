name: RAGECASES Fetch Skin Test 20

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-skins:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image downloader dependencies
        run: python -m pip install --disable-pip-version-check requests pillow

      - name: Download and validate 20 skin images
        run: python tools/ragecases_fetch_skins.py

      - name: Commit test images and report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ragecases_skins_v2_test
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "RAGECASES: fetch skin test 20"
            git push
          fi
