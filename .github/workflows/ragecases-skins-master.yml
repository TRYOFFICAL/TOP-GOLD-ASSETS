name: RAGECASES Skins Master

on:
  workflow_dispatch:
    inputs:
      force_redownload:
        description: 'Force re-download all files already present in assets/ragecases_skins_v2'
        required: false
        default: false
        type: boolean
      strict_repair_add_new:
        description: 'Full strict re-check of all ADD_NEW images'
        required: false
        default: false
        type: boolean
      repair_failed_only:
        description: 'Fast repair: retry only files from current FAILED_ITEMS.json'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  sync-master-skins:
    runs-on: ubuntu-latest
    env:
      FORCE_REDOWNLOAD: ${{ inputs.force_redownload }}
      STRICT_REPAIR_ADD_NEW: ${{ inputs.strict_repair_add_new }}
      REPAIR_FAILED_ONLY: ${{ inputs.repair_failed_only }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install downloader dependencies
        run: python -m pip install --disable-pip-version-check requests pillow beautifulsoup4

      - name: Resolve, download and validate RAGECASES master library
        id: fetch
        continue-on-error: true
        run: python tools/ragecases_fetch_master.py

      - name: Commit master images, reports and generated map
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ragecases_skins_v2
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "RAGECASES: repair failed skin images"
            git push
          fi

      - name: Final result
        if: always()
        run: |
          if [ -f assets/ragecases_skins_v2/READY_TO_SWITCH.txt ]; then
            echo "RAGECASES MASTER SKIN LIBRARY IS READY"
            exit 0
          fi
          echo "Some skins still need an exact source."
          echo "Open assets/ragecases_skins_v2/FAILED_ITEMS.json and REPORT.csv."
          exit 1
